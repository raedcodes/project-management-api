info:
  name: refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.getBody().data.token);
        bru.setVar("refreshToken", res.getBody().data.refreshToken);
    - type: tests
      code: |-
        test("returns 200 with a new token pair", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.refreshToken).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
