info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "dev@example.com",
        "password": "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.getBody().data.token);
    - type: tests
      code: |-
        test("returns 200 with a token", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
