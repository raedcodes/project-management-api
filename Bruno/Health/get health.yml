info:
  name: get health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200 with status ok", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.status).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
